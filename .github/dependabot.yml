# Mises à jour de dépendances, une fois par semaine.
# Stratégie du projet (cf. CLAUDE.md) : on monte les paquets vulnérables
# directement, jamais via des overrides pnpm.
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      # Un seul lot hebdomadaire pour tout ce qui ne change pas de majeure.
      # Les groupes par famille (next, react, tailwind) ont disparu : ils
      # existaient pour monter d'un bloc des paquets épinglés sur la même
      # version, ce qu'un lot unique garantit de fait.
      deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Les majeures dans un lot séparé : elles demandent une relecture, et les
      # isoler évite qu'une seule d'entre elles retienne les mises à jour
      # saines. Aucune majeure n'est ignorée : une PR en échec est une
      # information, et `ignore` la ferait disparaître — y compris pour les
      # mises à jour de sécurité de ces versions.
      majeures:
        patterns: ["*"]
        update-types: ["major"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    groups:
      github-actions:
        patterns: ["*"]
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
